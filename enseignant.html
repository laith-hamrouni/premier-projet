<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace enseignant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Espace enseignant</h1></header><a class="retour" href="index.html">← Accueil</a>
  <main>
    <div class="carte">
      <label for="etu">Étudiant</label>
      <select id="etu" onchange="remplirModules()"></select>
      <label for="mod">Module</label>
      <select id="mod" onchange="afficher()"></select>
    </div>

    <div class="carte">
      <p id="info"></p>
      <div class="actions">
        <button onclick="ajouterAbsence()">+ Ajouter une absence</button>
        <button onclick="retirerAbsence()">− Retirer une absence</button>
      </div>
      <p>
        <label for="note">Nouvelle note (/20)</label>
        <input id="note" type="number" min="0" max="20" step="0.25">
        <button onclick="changerNote()">Enregistrer</button>
      </p>
      <p id="message"></p>
    </div>

    <div class="carte">
      <button class="secondaire" onclick="reinitialiser()">Réinitialiser les données</button>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script>
    const selEtu = document.getElementById("etu");
    const selMod = document.getElementById("mod");
    const msg = document.getElementById("message");

    etudiants.forEach((e, i) => {
      selEtu.innerHTML += `<option value="${i}">${e.nom} (${e.matricule})</option>`;
    });

    function courant() {
      return etudiants[selEtu.value].modules[selMod.value];
    }

    function remplirModules() {
      const e = etudiants[selEtu.value];
      selMod.innerHTML = e.modules
        .map((m, i) => `<option value="${i}">${m.nom}</option>`).join("");
      afficher();
    }

    function afficher() {
      const m = courant();
      document.getElementById("info").innerHTML =
        `Note : <strong>${m.note}</strong> — Absences : <strong>${m.absences}</strong> / ${m.maxAbsences}`;
      document.getElementById("note").value = m.note;
    }

    function ajouterAbsence() {
      courant().absences++;
      sauvegarder();
      afficher();
      msg.textContent = "Absence ajoutée.";
      msg.className = "ok";
    }

    function retirerAbsence() {
      const m = courant();
      if (m.absences > 0) m.absences--;
      sauvegarder();
      afficher();
      msg.textContent = "Absence retirée.";
      msg.className = "ok";
    }

    function changerNote() {
      const v = parseFloat(document.getElementById("note").value);
      if (isNaN(v) || v < 0 || v > 20) {
        msg.textContent = "La note doit être comprise entre 0 et 20.";
        msg.className = "erreur";
        return;
      }
      courant().note = v;
      sauvegarder();
      afficher();
      msg.textContent = "Note enregistrée.";
      msg.className = "ok";
    }

    function reinitialiser() {
      localStorage.removeItem("etudiants");
      location.reload();
    }

    remplirModules();
  </script>
</body>
</html>
